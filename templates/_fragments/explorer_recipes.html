{# Sidopanelens filträd för Recept-vyn. Rendring sker client-side från
   mise-data JSON; servern lämnar bara skalet. #}
<div class="exp-head">
  <span class="exp-title">Recept</span>
  <select class="group-sel" id="rec-grouping">
    <option value="kok">efter kök</option>
    <option value="kategori">efter kategori</option>
    <option value="az">A–Ö</option>
  </select>
</div>
<div class="exp-search">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M21 21l-4-4"/></svg>
  <input id="rec-search" placeholder="Sök recept…" autocomplete="off" />
</div>
<div class="exp-sub">
  <div class="exp-mini">
    <a class="exp-mini-btn" href="/recipe/new/edit" style="font-family:var(--mono);font-size:10.5px;color:var(--ink3);padding:2px 6px;border:1px solid var(--line2);">+ nytt</a>
  </div>
  <span class="exp-count" id="rec-count"></span>
</div>
<div class="exp-scroll" id="rec-tree"></div>
